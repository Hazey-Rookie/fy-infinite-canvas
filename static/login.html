<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 扶摇AI Studio</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/vendor/css/fonts.css?v=2026.07.23.1784827838">
    <style>
        :root { color-scheme: light; --bg:#f5f7fa; --panel:#fff; --text:#17191d; --muted:#68707d; --line:#e4e8ee; --primary:#3370ff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,"Microsoft YaHei",sans-serif; letter-spacing:0; }
        main { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:32px; box-shadow:0 18px 48px rgba(23,25,29,.08); }
        .mark { width:40px; height:40px; display:grid; place-items:center; border:2px solid var(--text); border-radius:8px; margin-bottom:24px; font-weight:800; }
        h1 { margin:0 0 10px; font-size:24px; line-height:1.3; }
        p { margin:0 0 24px; color:var(--muted); line-height:1.7; font-size:14px; }
        a { min-height:44px; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:6px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; }
        a:hover { background:#2863e6; }
        .tenant-options { display:grid; gap:8px; margin-bottom:14px; }
        .tenant-options[hidden] { display:none; }
        .tenant-link { justify-content:flex-start; padding:0 14px; background:#f0f4ff; color:#174ea6; border:1px solid #c8d7ff; }
        .tenant-link:hover { background:#e4edff; }
        .status { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.6; }
        .status.error { color:#b42318; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">FY</div>
        <h1>登录扶摇AI Studio</h1>
        <p id="intro">使用企业飞书账号登录。你的菜单和操作权限将根据组织授权自动加载。</p>
        <div id="tenantOptions" class="tenant-options" hidden></div>
        <a id="loginBtn" href="/api/auth/feishu/login?return_to=%2F">使用飞书登录</a>
        <div class="status" id="status">正在检查登录配置...</div>
    </main>
    <script>
        fetch('/api/auth/config', {cache:'no-store'})
            .then(response => response.json())
            .then(config => {
                const status = document.getElementById('status');
                const loginButton = document.getElementById('loginBtn');
                const tenantOptions = document.getElementById('tenantOptions');
                const intro = document.getElementById('intro');
                if(config.sso_configured) {
                    status.textContent = '企业登录已连接，权限数据由本地安全存储维护';
                    const match = location.pathname.match(/^\/t\/([^/]+)/);
                    if(match) loginButton.href = `/api/auth/feishu/login?tenant=${encodeURIComponent(match[1])}&return_to=%2F`;
                    const tenants = Array.isArray(config.tenants) ? config.tenants.filter(item => item && item.enabled && item.slug && item.name) : [];
                    if(!match && tenants.length > 1) {
                        intro.textContent = '请选择要登录的企业，系统将使用该企业自己的飞书应用完成认证。';
                        tenantOptions.innerHTML = tenants.map(item => `<a class="tenant-link" href="/api/auth/feishu/login?tenant=${encodeURIComponent(item.slug)}&return_to=%2F">${String(item.name).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}</a>`).join('');
                        tenantOptions.hidden = false;
                        loginButton.hidden = true;
                    }
                    return;
                }
                status.classList.add('error');
                status.textContent = `飞书登录尚未配置完整：${(config.missing_sso_fields || []).join('、')}`;
                loginButton.hidden = true;
            })
            .catch(() => {
                const status = document.getElementById('status');
                status.classList.add('error');
                status.textContent = '无法读取登录配置，请检查服务是否已启动';
            });
    </script>
</body>
</html>
