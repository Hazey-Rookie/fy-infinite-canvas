<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 扶摇AI Studio</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/vendor/css/fonts.css?v=2026.08.01.1784827838">
    <style>
        :root { color-scheme: light; --bg:#f5f7fa; --panel:#fff; --text:#17191d; --muted:#68707d; --line:#e4e8ee; --primary:#3370ff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,"Microsoft YaHei",sans-serif; letter-spacing:0; }
        main { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:32px; box-shadow:0 18px 48px rgba(23,25,29,.08); }
        .mark { width:40px; height:40px; display:grid; place-items:center; border:2px solid var(--text); border-radius:8px; margin-bottom:24px; font-weight:800; }
        h1 { margin:0 0 10px; font-size:24px; line-height:1.3; }
        p { margin:0 0 24px; color:var(--muted); line-height:1.7; font-size:14px; }
        a, button { min-height:44px; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:6px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; border:0; width:100%; cursor:pointer; font:inherit; }
        a:hover, button:hover { background:#2863e6; }
        .divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; margin:20px 0; }
        .divider::before, .divider::after { content:""; height:1px; background:var(--line); flex:1; }
        form { display:grid; gap:10px; }
        label { font-size:12px; color:var(--muted); }
        input { width:100%; min-height:42px; border:1px solid var(--line); border-radius:6px; padding:0 12px; font:inherit; }
        input:focus { outline:2px solid rgba(51,112,255,.22); border-color:var(--primary); }
        .local { display:none; }
        .local.visible { display:block; }
        .status { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.6; }
        .status.error { color:#b42318; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">FY</div>
        <h1>登录扶摇AI Studio</h1>
        <p>企业成员使用飞书登录；外部协作者使用管理员提供的应用账号。菜单和操作权限将按授权加载。</p>
        <a id="loginBtn" href="/api/auth/feishu/login?return_to=%2F">使用飞书登录</a>
        <div class="divider" id="divider" hidden>或使用外部账号</div>
        <section class="local" id="localPanel">
            <form id="localLoginForm">
                <label for="username">账号</label>
                <input id="username" name="username" autocomplete="username" required>
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">登录</button>
            </form>
        </section>
        <div class="status" id="status">正在检查登录配置...</div>
    </main>
    <script>
        fetch('/api/auth/config', {cache:'no-store'})
            .then(response => response.json())
            .then(config => {
                const status = document.getElementById('status');
                const loginButton = document.getElementById('loginBtn');
                const localPanel = document.getElementById('localPanel');
                const divider = document.getElementById('divider');
                if(config.local_auth_enabled) { localPanel.classList.add('visible'); divider.hidden = !config.sso_configured; }
                if(config.sso_configured) { status.textContent = config.local_auth_enabled ? '可使用企业飞书或外部账号登录' : '企业登录已连接'; return; }
                if(config.local_auth_enabled) { loginButton.hidden = true; status.textContent = '请输入管理员提供的外部账号'; return; }
                status.classList.add('error');
                status.textContent = `登录尚未配置完整：${(config.missing_sso_fields || []).join('、')}`;
                loginButton.hidden = true;
            })
            .catch(() => {
                const status = document.getElementById('status');
                status.classList.add('error');
                status.textContent = '无法读取登录配置，请检查服务是否已启动';
            });
        document.getElementById('localLoginForm').addEventListener('submit', async event => {
            event.preventDefault();
            const status = document.getElementById('status');
            const button = event.currentTarget.querySelector('button');
            button.disabled = true;
            status.classList.remove('error');
            status.textContent = '正在登录...';
            try {
                const response = await fetch('/api/auth/local/login', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: event.currentTarget.username.value, password: event.currentTarget.password.value, return_to: '/'})
                });
                const data = await response.json().catch(() => ({}));
                if(!response.ok) throw new Error(data.detail || '登录失败');
                location.replace(data.return_to || '/');
            } catch(error) {
                status.classList.add('error'); status.textContent = error.message;
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
