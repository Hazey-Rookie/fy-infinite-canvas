<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 扶摇AI Studio</title>
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <link rel="stylesheet" href="/static/vendor/css/fonts.css?v=2026.08.01.1784827838">
    <style>
        :root { color-scheme: light; --bg:#f5f7fa; --panel:#fff; --text:#17191d; --muted:#68707d; --line:#e4e8ee; --primary:#3370ff; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font-family:Inter,"Microsoft YaHei",sans-serif; letter-spacing:0; }
        main { width:min(420px,100%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:32px; box-shadow:0 18px 48px rgba(23,25,29,.08); }
        .mark { width:40px; height:40px; display:grid; place-items:center; border:2px solid var(--text); border-radius:8px; margin-bottom:24px; font-weight:800; }
        h1 { margin:0 0 10px; font-size:24px; line-height:1.3; }
        p { margin:0 0 24px; color:var(--muted); line-height:1.7; font-size:14px; }
        a { min-height:44px; display:flex; align-items:center; justify-content:center; gap:9px; border-radius:6px; background:var(--primary); color:#fff; text-decoration:none; font-weight:700; }
        a:hover { background:#2863e6; }
        form { display:grid; gap:10px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
        form[hidden] { display:none; }
        input, select { min-height:40px; padding:0 10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
        form button { min-height:40px; border:0; border-radius:6px; background:#17202b; color:#fff; font-weight:700; cursor:pointer; }
        .tenant-options { display:grid; gap:8px; margin-bottom:14px; }
        .tenant-options[hidden] { display:none; }
        .tenant-link { justify-content:flex-start; padding:0 14px; background:#f0f4ff; color:#174ea6; border:1px solid #c8d7ff; }
        .tenant-link:hover { background:#e4edff; }
        .status { margin-top:18px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; line-height:1.6; }
        .status.error { color:#b42318; }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">FY</div>
        <h1>登录扶摇AI Studio</h1>
        <p id="intro">使用企业飞书账号登录。你的菜单和操作权限将根据组织授权自动加载。</p>
        <div id="tenantOptions" class="tenant-options" hidden></div>
        <a id="loginBtn" href="/api/auth/feishu/login?return_to=%2F">使用飞书登录</a>
        <form id="localLoginForm" hidden>
            <select id="localTenant" aria-label="选择企业"></select>
            <input id="localUsername" required autocomplete="username" placeholder="外部账号">
            <input id="localPassword" required type="password" autocomplete="current-password" placeholder="密码">
            <button type="submit">使用外部账号登录</button>
        </form>
        <div class="status" id="status">正在检查登录配置...</div>
    </main>
    <script>
        fetch('/api/auth/config', {cache:'no-store'})
            .then(response => response.json())
            .then(config => {
                const status = document.getElementById('status');
                const loginButton = document.getElementById('loginBtn');
                const tenantOptions = document.getElementById('tenantOptions');
                const intro = document.getElementById('intro');
                const localForm = document.getElementById('localLoginForm');
                const localTenant = document.getElementById('localTenant');
                const tenants = Array.isArray(config.tenants) ? config.tenants.filter(item => item && item.enabled && item.slug && item.name) : [{tenant_key:config.default_tenant_key||'default',slug:config.default_tenant_key||'default',name:'默认企业',enabled:true}];
                if(config.sso_configured) {
                    status.textContent = '企业登录已连接，权限数据由本地安全存储维护';
                    const match = location.pathname.match(/^\/t\/([^/]+)/);
                    if(match) loginButton.href = `/api/auth/feishu/login?tenant=${encodeURIComponent(match[1])}&return_to=%2F`;
                    if(config.local_auth_enabled){localTenant.innerHTML=tenants.map(item=>`<option value="${item.tenant_key}">${item.name}</option>`).join('');localForm.hidden=false;}
                    if(!match && tenants.length > 1) {
                        intro.textContent = '请选择要登录的企业，系统将使用该企业自己的飞书应用完成认证。';
                        tenantOptions.innerHTML = tenants.map(item => `<a class="tenant-link" href="/api/auth/feishu/login?tenant=${encodeURIComponent(item.slug)}&return_to=%2F">${String(item.name).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}</a>`).join('');
                        tenantOptions.hidden = false;
                        loginButton.hidden = true;
                    }
                    return;
                }
                if(config.local_auth_enabled){localTenant.innerHTML=tenants.map(item=>`<option value="${item.tenant_key}">${item.name}</option>`).join('');localForm.hidden=false;loginButton.hidden=true;status.textContent='请输入管理员提供的外部账号';return;}
                status.classList.add('error');
                status.textContent = `飞书登录尚未配置完整：${(config.missing_sso_fields || []).join('、')}`;
                loginButton.hidden = true;
            })
            .catch(() => {
                const status = document.getElementById('status');
                status.classList.add('error');
                status.textContent = '无法读取登录配置，请检查服务是否已启动';
            });
        document.getElementById('localLoginForm').addEventListener('submit', async event => {
            event.preventDefault();
            const form = event.target;
            try {
                const response = await fetch('/api/auth/local/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tenant_key:document.getElementById('localTenant').value, username:document.getElementById('localUsername').value, password:document.getElementById('localPassword').value, return_to:'/'})});
                const payload = await response.json().catch(()=>({}));
                if(!response.ok) throw new Error(payload.detail || '外部账号登录失败');
                location.href = payload.return_to || '/';
            } catch(error) { document.getElementById('status').textContent = error.message; document.getElementById('status').classList.add('error'); }
        });
    </script>
</body>
</html>
