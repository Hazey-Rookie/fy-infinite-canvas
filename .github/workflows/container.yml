name: Build and publish container

on:
  push:
    branches:
      - main
      - codex/fy-performance-4001-dev
    paths:
      - Dockerfile
      - compose.yaml
      - requirements.txt
      - package.json
      - package-lock.json
      - FY_VERSION
      - VERSION
      - main.py
      - fy_auth.py
      - static/**
      - workflows/**
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read FY version
        id: fy-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < FY_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:fy-${{ steps.fy-version.outputs.version }}
            ghcr.io/${{ github.repository }}:branch-${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.fy-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
