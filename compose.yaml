services:
  infinite-canvas:
    build:
      context: .
    container_name: infinite-canvas
    restart: unless-stopped
    ports:
      - "${FY_BIND_ADDRESS:-127.0.0.1}:${FY_HOST_PORT:-3000}:3000"
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
    volumes:
      - api-config:/app/API
      - canvas-data:/app/data
      - assets:/app/assets
      - output:/app/output
      - workflows:/app/workflows
      - codex-home:/home/app/.codex

volumes:
  api-config:
  canvas-data:
  assets:
  output:
  workflows:
  codex-home:
